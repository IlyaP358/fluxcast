<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!--
    NetworkManager (root) has a blanket allow send_destination=fi.w1.wpa_supplicant1.
    After wpas P2P GroupStarted it Set's BSSExpireAge/Pmf on the new group iface
    then RemoveInterface — that is DEAUTH_LEAVING on p2p-wlp*.

    D-Bus cannot match NM by systemd unit, only by user. NM and sudo FluxCast
    are both root. FluxCast does not call RemoveInterface (it uses
    P2PDevice.GroupRemove). Denying RemoveInterface for root stops NM from
    tearing down wpas groups.

    Risk: NM may use RemoveInterface when replacing the STA wpa object
    (Wi-Fi reset). Test: nmcli connection down/up on the STA profile.
  -->
  <policy user="root">
    <deny send_destination="fi.w1.wpa_supplicant1"
          send_interface="fi.w1.wpa_supplicant1"
          send_member="RemoveInterface"/>
  </policy>
</busconfig>
