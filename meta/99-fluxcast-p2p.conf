# FluxCast: NM owns STA (home Wi-Fi); wpas owns Miracast P2P.
# Do not unmanage the STA iface (wlp*, wlan*).
#
# GroupStarted is emitted on the STA wpa object (Interfaces/0). NM's
# wifi-p2p device must stay unmanaged so it does not p2p_disconnect /
# RemoveInterface the group after wpas Connect.
#
# Reload: nmcli general reload
# (do not restart NetworkManager — that drops the STA connection.)

[keyfile]
unmanaged-devices=interface-name:p2p-dev-*;interface-name:p2p-*

[device-fluxcast-p2p-groups]
match-device=interface-name:p2p-*
managed=0

[device-fluxcast-wifi-p2p]
match-device=type:wifi-p2p
managed=0
