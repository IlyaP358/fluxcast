<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!--
    Allow local users to set the P2P device name in wpa_supplicant via D-Bus.
    Install to /etc/dbus-1/system.d/ (once, as root):
      sudo cp meta/dev.fluxcast.wpa-supplicant.conf /etc/dbus-1/system.d/
      sudo systemctl reload dbus
  -->
  <policy context="default">
    <allow send_destination="fi.w1.wpa_supplicant1"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="fi.w1.wpa_supplicant1"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Set"/>
    <allow receive_sender="fi.w1.wpa_supplicant1"/>
  </policy>
</busconfig>
