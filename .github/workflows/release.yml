name: release

on:
  release:
    types: [published]

jobs:
  appimage:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          sed -i -E "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          # only the indented app_info version, NOT the recipe's `version: 1`
          sed -i -E "s/^([[:space:]]+)version:[[:space:]]*.*/\1version: $VERSION/" appimage/AppImageBuilder.yml

      - name: Build AppImage
        run: bash appimage/build_appimage.sh

      - name: Attach AppImage to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" appimage/FluxCast-*-x86_64.AppImage --clobber

  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          sed -i -E "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
