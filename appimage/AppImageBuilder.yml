version: 1

AppDir:
  path: ./AppDir
  app_info:
    id: fluxcast
    name: FluxCast
    icon: fluxcast
    version: 0.1.3
    exec: usr/bin/fluxcast-launcher
    exec_args: "$@"

  apt:
    arch: amd64
    sources:
      - sourceline: 'deb [trusted=yes] http://archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse'
      - sourceline: 'deb [trusted=yes] http://archive.ubuntu.com/ubuntu/ jammy-updates main restricted universe multiverse'
      - sourceline: 'deb [trusted=yes] http://archive.ubuntu.com/ubuntu/ jammy-security main restricted universe multiverse'
    include:
      # Python runtime
      - python3
      - python3-pip
      - python3-gi
      - python3-tk

      # GDK Pixbuf
      - libgdk-pixbuf2.0-bin

      # GObject Introspection typelibs
      - libgirepository-1.0-1
      - gir1.2-glib-2.0
      - gir1.2-appindicator3-0.1 # pystray appindicator backend

      - libglib2.0-bin
      - libnotify-bin
      - x11-xserver-utils

    exclude:
      - libasound2
      - libdbus-1-3
      - libx11-6
      - libgl1
      - libpulse0
      - wpa-supplicant
      - libgstreamer1.0-0
      - libgstreamer-plugins-base1.0-0
      - libgstreamer-plugins-bad1.0-0

  files:
    exclude:
      - usr/lib/python3*/dist-packages/tests
      - usr/share/doc
      - usr/share/man

  runtime:
    env:
      GI_TYPELIB_PATH: '${APPDIR}/usr/lib/x86_64-linux-gnu/girepository-1.0:${APPDIR}/usr/lib/girepository-1.0:/usr/lib/x86_64-linux-gnu/girepository-1.0:/usr/lib/girepository-1.0'
      TCL_LIBRARY: '${APPDIR}/usr/share/tcltk/tcl8.6'
      TK_LIBRARY: '${APPDIR}/usr/share/tcltk/tk8.6'
      PYTHONPATH: '${APPDIR}/usr/lib/python3/dist-packages'
      PATH: '${APPDIR}/usr/bin:${PATH}'

  after_bundle:
    - |
      APPDIR="$(realpath ./AppDir)"
      "${APPDIR}/usr/bin/python3" -m pip install \
        --target="${APPDIR}/usr/lib/python3/dist-packages" \
        -r /project/appimage/requirements-appimage.txt

      # --- Static ffmpeg -------------------------------------------------------
      _cache="/project/appimage/.build-cache/ffmpeg-static"
      _dest="${APPDIR}/usr/lib/fluxcast/ffmpeg-static"
      mkdir -p "${APPDIR}/usr/lib/fluxcast"

      if [ ! -x "${_cache}" ]; then
        echo "[FluxCast Build] Downloading static ffmpeg (one-time, ~70 MB)..."
        mkdir -p "/project/appimage/.build-cache"
        _td="$(mktemp -d)"
        _url="https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
        _ok=0
        if command -v wget >/dev/null 2>&1; then
          wget -q --show-progress -O "${_td}/ffmpeg.tar.xz" "${_url}" && _ok=1
        elif command -v curl >/dev/null 2>&1; then
          curl -L --progress-bar -o "${_td}/ffmpeg.tar.xz" "${_url}" && _ok=1
        fi
        if [ "${_ok}" = "1" ]; then
          tar -xf "${_td}/ffmpeg.tar.xz" -C "${_td}"
          _ff="$(find "${_td}" -maxdepth 2 -name "ffmpeg" -type f -executable | head -1)"
          if [ -n "${_ff}" ]; then
            mv "${_ff}" "${_cache}"
            chmod +x "${_cache}"
            echo "[FluxCast Build] Static ffmpeg cached."
          else
            echo "[FluxCast Build] WARNING: ffmpeg binary not found in archive." >&2
          fi
        else
          echo "[FluxCast Build] WARNING: Download failed — system ffmpeg will be required." >&2
        fi
        rm -rf "${_td}"
      fi

      if [ -x "${_cache}" ]; then
        cp "${_cache}" "${_dest}"
        echo "[FluxCast Build] Static ffmpeg bundled ($(du -sh "${_dest}" | cut -f1))."
      fi
      # -------------------------------------------------------------------------

      # ffmpeg: smart wrapper
      cp /project/appimage/ffmpeg_wrapper.sh "${APPDIR}/usr/bin/ffmpeg"
      chmod +x "${APPDIR}/usr/bin/ffmpeg"

      for _tool in wf-recorder gst-launch-1.0 gst-inspect-1.0; do
        cp /project/appimage/sysbin_wrapper.sh "${APPDIR}/usr/bin/${_tool}"
        chmod +x "${APPDIR}/usr/bin/${_tool}"
      done

AppImage:
  update-information: 'none'
  sign-key: 'None'
  arch: x86_64
